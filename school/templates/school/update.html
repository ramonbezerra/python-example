{% extends 'base.html' %}

{% block title %}Course Update{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">School - Course Update - {{ course.name }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Update</button>
</form>
{% endblock %}
