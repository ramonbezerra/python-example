{% extends 'base.html' %}

{% block title %}Courses{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">School - Courses</h1>

<button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mb-4 rounded"
    ><a href="{% url 'school:course_create' %}">Create a new course</a></button>

<ul>
    {% for course in courses %}
        <li class="text-lg mb-2"><a href="{% url 'school:course_detail' course.pk %}">{{ course.name }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
