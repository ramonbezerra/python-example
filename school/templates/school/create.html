{% extends 'base.html' %}

{% block title %}Create Course{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">School - Create Course</h1>

<form class="mb-4" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Create</button>
</form>
<a class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 mb-4 rounded" href="{% url 'school:courses_list' %}">Back</a>
{% endblock %}
