{% extends 'base.html' %}

{% block title %}Delete Course{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">School - Delete Course - {{ course.name }}</h1>

<form class="mb-4" method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this course?</p>
    <button type="submit" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Yes, Delete</button>
</form>
<a class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 mb-4 rounded" href="{% url 'school:course_detail' course.pk %}">Cancel</a>
{% endblock %}
